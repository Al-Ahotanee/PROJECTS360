services:
  - type: web
    name: projects360-api
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start:prod --workspace apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
  - type: static
    name: projects360-web
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: apps/web/dist/projects360-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        sync: false
